<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="ML-Algorithms: 24 machine learning algorithms built from scratch">
  <defs>
    <linearGradient id="title" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="700" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#ebbcba"/><stop offset=".33" stop-color="#c4a7e7"/><stop offset=".66" stop-color="#9ccfd8"/><stop offset="1" stop-color="#ebbcba"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="400 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26233a"/></pattern>
    <clipPath id="card"><rect width="1000" height="320" rx="20"/></clipPath>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
    .pt { opacity:0; transform-box:fill-box; transform-origin:center; animation:pop 9s ease-out infinite both; }
    @keyframes pop { 0%{opacity:0;transform:scale(0)} 4%{opacity:1;transform:scale(1.5)} 7%{transform:scale(1)} 82%{opacity:1;transform:scale(1)} 92%,100%{opacity:0;transform:scale(0)} }
    .boundary { stroke-dasharray:270; stroke-dashoffset:270; animation:draw 9s ease-in-out infinite; }
    @keyframes draw { 0%,38%{stroke-dashoffset:270} 55%,82%{stroke-dashoffset:0} 92%,100%{stroke-dashoffset:-270} }
    .loss { opacity:0; animation:fade 9s infinite; }
    @keyframes fade { 0%,55%{opacity:0} 60%,82%{opacity:1} 90%,100%{opacity:0} }
    .pulse { stroke-width:2.2; stroke-linecap:round; stroke-dasharray:10 110; stroke-dashoffset:110; animation:flow 1.8s linear infinite; }
    @keyframes flow { to{stroke-dashoffset:0} }
    .node { animation:glow 1.8s ease-in-out infinite; }
    @keyframes glow { 0%,100%{stroke-width:2} 50%{stroke-width:4} }
    .tk { opacity:0; animation:tick 30.6s infinite both; }
    @keyframes tick { 0%{opacity:0;transform:translateY(8px)} 0.71%{opacity:1;transform:translateY(0)} 5.00%{opacity:1;transform:translateY(0)} 5.88%,100%{opacity:0;transform:translateY(-8px)} }
    .cur { animation:blink 1s steps(1) infinite; }
    @keyframes blink { 50%{opacity:0} }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="320" fill="#191724"/>
    <rect width="1000" height="320" fill="url(#dots)" opacity=".7"/>
  </g>
  <rect x=".75" y=".75" width="998.5" height="318.5" rx="20" fill="none" stroke="#26233a" stroke-width="1.5"/>

  <!-- scatter plot: classes appear, then the decision boundary is learned -->
  <rect x="40" y="50" width="220" height="220" rx="14" fill="#1f1d2e" stroke="#26233a"/>
  <text x="54" y="72" font-size="11" fill="#6e6a86">classify()</text>
    <circle class="pt" cx="226.4" cy="159.2" r="4.2" fill="#9ccfd8" style="animation-delay:0.00s"/>
    <circle class="pt" cx="93.2" cy="167.0" r="4.2" fill="#c4a7e7" style="animation-delay:0.11s"/>
