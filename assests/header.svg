    <text class="tk" x="500" y="200" style="animation-delay:18.0s"><tspan fill="#eb6f92">› </tspan><tspan fill="#6e6a86">fit </tspan>DBSCAN<tspan class="cur" fill="#9ccfd8"> ▌</tspan></text>
    <text class="tk" x="500" y="200" style="animation-delay:19.8s"><tspan fill="#eb6f92">› </tspan><tspan fill="#6e6a86">fit </tspan>PCA<tspan class="cur" fill="#9ccfd8"> ▌</tspan></text>
    <text class="tk" x="500" y="200" style="animation-delay:21.6s"><tspan fill="#eb6f92">› </tspan><tspan fill="#6e6a86">fit </tspan>Isolation Forest<tspan class="cur" fill="#9ccfd8"> ▌</tspan></text>
    <text class="tk" x="500" y="200" style="animation-delay:23.4s"><tspan fill="#eb6f92">› </tspan><tspan fill="#6e6a86">fit </tspan>ANN<tspan class="cur" fill="#9ccfd8"> ▌</tspan></text>
    <text class="tk" x="500" y="200" style="animation-delay:25.2s"><tspan fill="#eb6f92">› </tspan><tspan fill="#6e6a86">fit </tspan>CNN<tspan class="cur" fill="#9ccfd8"> ▌</tspan></text>
    <text class="tk" x="500" y="200" style="animation-delay:27.0s"><tspan fill="#eb6f92">› </tspan><tspan fill="#6e6a86">fit </tspan>RNN<tspan class="cur" fill="#9ccfd8"> ▌</tspan></text>
    <text class="tk" x="500" y="200" style="animation-delay:28.8s"><tspan fill="#eb6f92">› </tspan><tspan fill="#6e6a86">fit </tspan>RAG pipeline<tspan class="cur" fill="#9ccfd8"> ▌</tspan></text>
