    <circle class="pt" cx="232.4" cy="224.0" r="4.2" fill="#9ccfd8" style="animation-delay:2.31s"/>
    <circle class="pt" cx="60.1" cy="115.7" r="4.2" fill="#c4a7e7" style="animation-delay:2.42s"/>
    <circle class="pt" cx="223.8" cy="159.9" r="4.2" fill="#9ccfd8" style="animation-delay:2.53s"/>
    <circle class="pt" cx="236.5" cy="147.6" r="4.2" fill="#9ccfd8" style="animation-delay:2.64s"/>
    <circle class="pt" cx="73.1" cy="187.0" r="4.2" fill="#c4a7e7" style="animation-delay:2.75s"/>
  <line class="boundary" x1="55" y1="255" x2="245" y2="65" stroke="#f6c177" stroke-width="2.5" stroke-linecap="round"/>
  <text class="loss" x="246" y="258" font-size="11" fill="#f6c177" text-anchor="end">acc 0.97</text>

  <!-- neural network: signals flow forward through the layers -->
  <rect x="740" y="50" width="220" height="220" rx="14" fill="#1f1d2e" stroke="#26233a"/>
  <text x="754" y="72" font-size="11" fill="#6e6a86">forward()</text>
