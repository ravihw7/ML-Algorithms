  <!-- title block -->
  <text x="500" y="112" font-size="46" font-weight="700" fill="url(#title)" text-anchor="middle" letter-spacing="1">ML-Algorithms</text>
  <text x="500" y="146" font-size="15" fill="#6e6a86" text-anchor="middle">24 algorithms · built from scratch · Python</text>

  <g font-size="18" fill="#e0def4" text-anchor="middle">
    <text class="tk" x="500" y="200" style="animation-delay:0.0s"><tspan fill="#eb6f92">› </tspan><tspan fill="#6e6a86">fit </tspan>Linear Regression<tspan class="cur" fill="#9ccfd8"> ▌</tspan></text>
    <text class="tk" x="500" y="200" style="animation-delay:1.8s"><tspan fill="#eb6f92">› </tspan><tspan fill="#6e6a86">fit </tspan>Lasso Regression<tspan class="cur" fill="#9ccfd8"> ▌</tspan></text>
    <text class="tk" x="500" y="200" style="animation-delay:3.6s"><tspan fill="#eb6f92">› </tspan><tspan fill="#6e6a86">fit </tspan>Logistic Regression<tspan class="cur" fill="#9ccfd8"> ▌</tspan></text>
    <text class="tk" x="500" y="200" style="animation-delay:5.4s"><tspan fill="#eb6f92">› </tspan><tspan fill="#6e6a86">fit </tspan>Naive Bayes<tspan class="cur" fill="#9ccfd8"> ▌</tspan></text>
    <text class="tk" x="500" y="200" style="animation-delay:7.2s"><tspan fill="#eb6f92">› </tspan><tspan fill="#6e6a86">fit </tspan>k-Nearest Neighbors<tspan class="cur" fill="#9ccfd8"> ▌</tspan></text>
    <text class="tk" x="500" y="200" style="animation-delay:9.0s"><tspan fill="#eb6f92">› </tspan><tspan fill="#6e6a86">fit </tspan>Decision Tree<tspan class="cur" fill="#9ccfd8"> ▌</tspan></text>
    <text class="tk" x="500" y="200" style="animation-delay:10.8s"><tspan fill="#eb6f92">› </tspan><tspan fill="#6e6a86">fit </tspan>SVM<tspan class="cur" fill="#9ccfd8"> ▌</tspan></text>
    <text class="tk" x="500" y="200" style="animation-delay:12.6s"><tspan fill="#eb6f92">› </tspan><tspan fill="#6e6a86">fit </tspan>Random Forest<tspan class="cur" fill="#9ccfd8"> ▌</tspan></text>
    <text class="tk" x="500" y="200" style="animation-delay:14.4s"><tspan fill="#eb6f92">› </tspan><tspan fill="#6e6a86">fit </tspan>XGBoost<tspan class="cur" fill="#9ccfd8"> ▌</tspan></text>
